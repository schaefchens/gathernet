name: gathernet-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gathernet
      POSTGRES_PASSWORD: gathernet_dev
      POSTGRES_DB: gathernet
    ports:
      # 55432 on the host: avoids colliding with any locally installed postgres
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gathernet -d gathernet']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for encrypted message/community media blobs.
  # Ciphertext ONLY ever reaches it (the per-file key stays in the E2EE message body),
  # and it is a PROXIED backend: the browser never talks to it — only our server does.
  #   DEV: bound to 127.0.0.1:9000 so the host-run `pnpm dev` server can reach it. Our
  #   client code never references it. PROD: do NOT publish these ports — run the
  #   server in a container on this network and let it reach rustfs:9000 internally,
  #   so the store is not an externally reachable attack surface.
  # Pinned by digest (tested rustfs/rustfs:latest, 2026-08) for reproducibility.
  rustfs:
    image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    command: ['server', '/data']
    environment:
      RUSTFS_ACCESS_KEY: gathernet
      RUSTFS_SECRET_KEY: gathernet_dev_secret
      RUSTFS_VOLUMES: /data
    ports:
      # DEV ONLY, localhost-bound. Remove in production (keep rustfs internal).
      - '127.0.0.1:9000:9000'
    volumes:
      - rustfsdata:/data

  # Tor v3 hidden service — exposes the app over a self-authenticating .onion address
  # (no exit node, no DNS, no IP leak). Forwards onion:80 to the host-run dev server
  # (`pnpm dev` on :5173). The onion KEY persists in the `tordata` volume, so the
  # address stays the SAME across restarts and can be shared for testing over Tor.
  # After first `docker compose up tor`, copy the printed .onion into ONION_HOST (see
  # docs/onion.md) and restart the dev server so Vite accepts that host.
  tor:
    build: ./docker/tor
    environment:
      HS_TARGET: host.docker.internal:5173
      HS_TLS_TARGET: onion-tls:8443
    extra_hosts:
      # Lets the container reach the host's dev server on Linux too (automatic on macOS).
      - 'host.docker.internal:host-gateway'
    volumes:
      - tordata:/var/lib/tor
      # Seed the onion identity from a locally-held (vanity) key, if present. Gitignored —
      # the key is a secret. Empty/absent → Tor generates a random address.
      - ./docker/tor/seed:/seed:ro
      # Where the entrypoint mints the onion's TLS cert, for `onion-tls` to serve.
      - onioncerts:/certs
    restart: unless-stopped

  # Terminates TLS for the onion's :443 and forwards to the plain dev server. A separate
  # hop rather than `server.https` in Vite, so `pnpm dev` keeps serving plain HTTP on
  # localhost and nothing about the normal dev loop changes.
  onion-tls:
    image: caddy:2-alpine
    # Wait for the cert `tor` mints — Caddy will not boot with `tls` naming a missing file.
    command: >
      sh -c 'i=0; while [ ! -f /certs/onion.crt ] && [ "$$i" -lt 60 ]; do sleep 1; i=$$((i+1)); done;
             exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - ./docker/tor/onion-tls.Caddyfile:/etc/caddy/Caddyfile:ro
      - onioncerts:/certs:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - tor
    restart: unless-stopped

volumes:
  pgdata:
  rustfsdata:
  tordata:
  onioncerts:
