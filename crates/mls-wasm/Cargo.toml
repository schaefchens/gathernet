[package]
name = "mls-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The wasm-opt bundled with wasm-pack needs post-MVP features enabled explicitly
# (rustc emits bulk-memory/sign-ext/nontrapping-fptoint by default).
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-reference-types",
]

[dependencies]
mls-rs = { version = "0.55.2", default-features = false, features = [
  "std",
  "rfc_compliant",
  "fast_serialize",
  "last_resort_key_package_ext",
  "out_of_order",
  "prior_epoch",
] }
mls-rs-core = "0.27.0"
mls-rs-crypto-rustcrypto = { version = "0.22.0", default-features = false, features = ["std"] }
wasm-bindgen = "0.2.126"
js-sys = "0.3"
getrandom02 = { package = "getrandom", version = "0.2" }
getrandom03 = { package = "getrandom", version = "0.3" }
bip39 = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
sha2 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
minicbor = { version = "2", default-features = false, features = ["alloc"] }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "2"
hex = "0.4"

# mls-rs pulls both getrandom 0.2 and 0.3; enable the wasm backends for both
# (0.3's "wasm_js" additionally needs --cfg getrandom_backend="wasm_js", set in ../.cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

